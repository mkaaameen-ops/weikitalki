<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Passport Photo Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #f5f8fa;
            --surface: #ffffff;
            --text-main: #0f1a24;
            --text-muted: #627d98;
            --primary: #1975ff;
            --primary-hover: #0056cc;
            --success: #10b981;
            --border-color: #e2e8f0;
            --upload-dash: #cbd5e1;
            --shadow: 0 20px 40px rgba(15, 26, 36, 0.05);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .app-container {
            max-width: 1100px;
            width: 100%;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        header {
            margin-bottom: 32px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .logo-icon {
            font-size: 1.8rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .privacy-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            background: #edf5ff;
            padding: 4px 12px;
            border-radius: 100px;
            margin-top: 4px;
        }

        .upload-card {
            border: 2px dashed var(--upload-dash);
            border-radius: 16px;
            background-color: #fafbfc;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin-bottom: 24px;
        }

        .upload-card:hover, .upload-card.dragover {
            border-color: var(--primary);
            background-color: #f5f9ff;
        }

        .upload-card input[type="file"] {
            display: none;
        }

        .icon-bucket {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .upload-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .upload-card p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .btn-browse {
            background-color: var(--surface);
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: all 0.15s ease;
        }

        .btn-browse:hover {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        .status-container {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #475569;
            word-break: break-word;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid #cbd5e1;
            border-top: 2.5px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status-container.loading .spinner {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-bottom: 36px;
        }

        .preview-pane {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pane-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stage-view {
            background: #f1f5f9;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            aspect-ratio: 4 / 5;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .stage-view img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .view-fallback {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .action-tray {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            border-top: 1px solid var(--border-color);
            padding-top: 32px;
        }

        .btn-action {
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-fill-primary {
            background-color: var(--primary);
            color: white;
        }
        .btn-fill-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-fill-success {
            background-color: var(--success);
            color: white;
        }
        .btn-fill-success:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid #cbd5e1;
            color: #475569;
            margin-left: auto;
        }
        .btn-outline:hover {
            background-color: #f8fafc;
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 24px;
            }
            .preview-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .action-tray {
                flex-direction: column;
            }
            .btn-action {
                width: 100%;
                justify-content: center;
            }
            .btn-outline {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo-area">
                <span class="logo-icon">🪪</span>
                <h1>AI Passport Photo Studio</h1>
            </div>
            <div class="privacy-badge">
                🛡️ 100% Local AI – Secure Private Canvas
            </div>
        </header>

        <div class="upload-card" id="uploadCard">
            <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp" />
            <div class="icon-bucket">📥</div>
            <h3>Drag and drop your portrait here</h3>
            <p>Supports PNG, JPG, or WebP up to 20MB</p>
            <button class="btn-browse" type="button">Browse Device</button>
        </div>

        <div class="status-container" id="statusContainer">
            <div class="spinner" id="statusSpinner"></div>
            <span class="status-text" id="statusMessage">Waiting for an image upload...</span>
        </div>

        <div class="preview-grid">
            <div class="preview-pane">
                <span class="pane-title">📷 Original Portrait</span>
                <div class="stage-view" id="originalViewport">
                    <span class="view-fallback">No image source</span>
                </div>
            </div>

            <div class="preview-pane">
                <span class="pane-title">✨ Processed ID Photo</span>
                <div class="stage-view" id="processedViewport">
                    <span class="view-fallback">Awaiting execution</span>
                </div>
            </div>
        </div>

        <div class="action-tray">
            <button class="btn-action btn-fill-primary" id="btnDownloadFull" type="button" disabled>
                ⬇️ Download Full Res White BG
            </button>
            <button class="btn-action btn-fill-success" id="btnDownloadPassport" type="button" disabled>
                ✂️ Generate Passport Size (2x2" / 600px)
            </button>
            <button class="btn-action btn-outline" id="btnReset" type="button" disabled>
                ↺ Start Over
            </button>
        </div>
    </div>

    <script type="module">
        let removeBackground;

        // Dynamic fallback loader targeting structural assets across unpkg/jsdelivr networks
        async function initEngine() {
            try {
                const module = await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.4/dist/background-removal.esm.js");
                removeBackground = module.removeBackground;
                return "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.4/dist/";
            } catch (e) {
                const module = await import("https://unpkg.com/@imgly/background-removal@1.4.4/dist/background-removal.esm.js");
                removeBackground = module.removeBackground;
                return "https://unpkg.com/@imgly/background-removal@1.4.4/dist/";
            }
        }

        const uploadCard = document.getElementById('uploadCard');
        const imageInput = document.getElementById('imageInput');
        const statusContainer = document.getElementById('statusContainer');
        const statusMessage = document.getElementById('statusMessage');
        const originalViewport = document.getElementById('originalViewport');
        const processedViewport = document.getElementById('processedViewport');
        const btnDownloadFull = document.getElementById('btnDownloadFull');
        const btnDownloadPassport = document.getElementById('btnDownloadPassport');
        const btnReset = document.getElementById('btnReset');

        let originalUrl = null;
        let whiteBgBlob = null;
        let passportBlob = null;

        uploadCard.addEventListener('click', () => imageInput.click());

        uploadCard.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadCard.classList.add('dragover');
        });
        uploadCard.addEventListener('dragleave', () => uploadCard.classList.remove('dragover'));
        uploadCard.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadCard.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        async function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file.');
                return;
            }

            resetWorkspace();
            originalUrl = URL.createObjectURL(file);
            originalViewport.innerHTML = `<img src="${originalUrl}" alt="Original">`;

            statusContainer.classList.add('loading');
            statusMessage.textContent = "Connecting to AI background framework...";

            try {
                const basePath = await initEngine();
                statusMessage.textContent = "🤖 Model downloading... (First run takes ~15 seconds to cache layers)";

                const cleanPngBlob = await removeBackground(file, {
                    publicPath: basePath,
                    fetchArgs: { mode: 'cors' }, // Force clean cross-origin fetching rules
                    progress: (key, current, total) => {
                        const pct = Math.round((current / total) * 100);
                        if (key === 'model') {
                            statusMessage.textContent = `📦 Fetching neural architecture weights... ${pct}%`;
                        } else if (key === 'inference') {
                            statusMessage.textContent = `🧠 Stripping portrait backgrounds... ${pct}%`;
                        }
                    }
                });

                statusMessage.textContent = "🎨 Rendering crisp white photo passport dimensions...";

                const fullCanvas = await compositeOnWhite(cleanPngBlob);
                whiteBgBlob = await canvasToBlob(fullCanvas);

                const passportCanvas = await createPassportCrop(fullCanvas);
                passportBlob = await canvasToBlob(passportCanvas);

                const processedUrl = URL.createObjectURL(whiteBgBlob);
                processedViewport.innerHTML = `<img src="${processedUrl}" alt="Processed ID">`;

                statusContainer.classList.remove('loading');
                statusMessage.textContent = "✅ Portrait parsed successfully! Ready for use.";
                btnDownloadFull.disabled = false;
                btnDownloadPassport.disabled = false;
                btnReset.disabled = false;

            } catch (error) {
                console.error("AI Studio Debug Log:", error);
                statusContainer.classList.remove('loading');
                // Informational printout identifying precise breakdown metrics (CORS vs Security Context)
                statusMessage.innerHTML = `❌ <strong>Execution Blocked:</strong> ${error.message || 'Asset loading failure'}.<br><span style="font-size:0.8rem; color:var(--text-muted);">Tip: Double check you are running this page from an active local host web server environment (like VS Code Live Server) or secure HTTPS context, as local file systems block background WASM components.</span>`;
                btnReset.disabled = false;
            }
        }

        function compositeOnWhite(blob) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(blob);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    resolve(canvas);
                };
                img.src = url;
            });
        }

        function createPassportCrop(sourceCanvas) {
            return new Promise((resolve) => {
                const size = Math.min(sourceCanvas.width, sourceCanvas.height);
                const sourceX = (sourceCanvas.width - size) / 2;
                const sourceY = (sourceCanvas.height - size) / 2;

                const targetCanvas = document.createElement('canvas');
                targetCanvas.width = 600;
                targetCanvas.height = 600;
                const ctx = targetCanvas.getContext('2d');

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, 600, 600);
                ctx.drawImage(sourceCanvas, sourceX, sourceY, size, size, 0, 0, 600, 600);
                resolve(targetCanvas);
            });
        }

        function canvasToBlob(canvas) {
            return new Promise((resolve) => canvas.toBlob(resolve, 'image/png', 1.0));
        }

        btnDownloadFull.addEventListener('click', () => {
            if (whiteBgBlob) triggerDownload(whiteBgBlob, 'passport_full_res.png');
        });

        btnDownloadPassport.addEventListener('click', () => {
            if (passportBlob) triggerDownload(passportBlob, 'passport_600x600_crop.png');
        });

        function triggerDownload(blob, filename) {
            const tempUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = tempUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(tempUrl), 100);
        }

        function resetWorkspace() {
            if (originalUrl) URL.revokeObjectURL(originalUrl);
            originalUrl = null;
            whiteBgBlob = null;
            passportBlob = null;
        }

        btnReset.addEventListener('click', () => {
            resetWorkspace();
            imageInput.value = '';
            originalViewport.innerHTML = `<span class="view-fallback">No image source</span>`;
            processedViewport.innerHTML = `<span class="view-fallback">Awaiting execution</span>`;
            statusMessage.textContent = "Waiting for an image upload...";
            btnDownloadFull.disabled = true;
            btnDownloadPassport.disabled = true;
            btnReset.disabled = true;
        });
    </script>
</body>
</html>
